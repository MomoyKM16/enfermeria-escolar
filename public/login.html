<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Enfermería Escolar - Entrar</title>
  <link rel="stylesheet" href="css/base.css">
</head>
<body class="pagina-login">
  <main class="tarjeta-login">
    <div class="logo-login">+</div>
    <h1>Enfermería Escolar</h1>
    <p class="suave">Entra con tu usuario y tu clave.</p>

    <form id="form-login">
      <div class="campo-form">
        <label for="usuario">Usuario</label>
        <input id="usuario" type="text" required autocomplete="username">
      </div>
      <div class="campo-form">
        <label for="clave">Clave</label>
        <input id="clave" type="password" required autocomplete="current-password">
      </div>
      <p id="mensaje" class="mensaje-error"></p>
      <button type="submit" class="boton-ancho">Entrar</button>
    </form>
  </main>

  <script src="js/api.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
