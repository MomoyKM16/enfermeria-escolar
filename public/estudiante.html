<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Perfil del estudiante - Enfermería Escolar</title>
  <link rel="stylesheet" href="css/base.css">
</head>
<body>
  <header class="barra">
    <h1 class="marca">Enfermería Escolar</h1>
    <nav>
      <a href="dashboard.html">Inicio</a>
      <a href="orientacion.html">Orientación</a>
    </nav>
    <div id="barra-usuario"></div>

  <main class="contenedor">
    <div style="margin-top: 20px;">
      <a class="boton boton-suave" href="dashboard.html">Volver</a>

    <div id="perfil"></div>
    <div id="avisos"></div>

        <thead>
          <tr><th>Fecha</th><th>Motivo</th><th>Tratamiento</th><th>Estado</th><th>Orientación</th></tr>
        </thead>
        <tbody id="tabla-visitas"></tbody>

  <script src="js/datos-falsos.js"></script>
